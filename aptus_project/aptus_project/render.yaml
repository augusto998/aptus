services:
  - type: web
    name: aptus-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "run:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aptus-db
          property: connectionString

databases:
  - name: aptus-db
    databaseName: aptus
    user: aptus
