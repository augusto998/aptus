{% extends 'base.html' %}{% block title %}Criar conta — APTUS{% endblock %}
{% block body %}<div class="auth-shell"><div class="auth-card wide"><a class="brand" href="{{ url_for('main.index') }}"><span>✦</span> APTUS</a><p class="eyebrow">NOVA CONTA</p><h1>Comece sua jornada.</h1><p class="muted">Seu perfil pode evoluir com você.</p>
<form method="post" class="stack"><label>Nome completo<input name="display_name" required></label><label>Nome de usuário<input name="username" required minlength="3"></label><label>E-mail<input type="email" name="email" required></label><label>Senha<input type="password" name="password" required minlength="6"></label><button class="btn primary" type="submit">Criar conta</button></form><a class="back" href="{{ url_for('main.user_login') }}">Já tenho conta</a></div></div>{% endblock %}
